spring.application.name=catan

spring.datasource.url=jdbc:mysql://localhost:3306/catan?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
# Ajusta aquesta contrasenya a la configurada al teu MySQL local.
spring.datasource.password=YES

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Noms de taula/columna exactament com a les anotacions (@Table(name = "Partida")...), igual que
# l'Hibernate de consola. Sense això Spring els passa a minúscules i crea taules duplicades.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Les relacions LAZY només es llegeixen dins del servei (@Transactional): els DTO es construeixen allà
spring.jpa.open-in-view=false
